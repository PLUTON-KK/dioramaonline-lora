<title>Pojedynki LoRA budynki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f3f1ea;--panel:#fffdf7;--fg:#22251f;--mut:#6b6f62;--line:#d9d5c7;--acc:#2f7d4f;--acc2:#b5462f;--tile:#e6e2d4;--hi:#fff4c2;
  font-family:"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f1a;--panel:#252a23;--fg:#ecebe4;--mut:#a3a796;--line:#3a4036;--acc:#5fc287;--acc2:#e3765d;--tile:#2f352c;--hi:#4a4424;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1f1a;--panel:#252a23;--fg:#ecebe4;--mut:#a3a796;--line:#3a4036;--acc:#5fc287;--acc2:#e3765d;--tile:#2f352c;--hi:#4a4424;color-scheme:dark}
body{background:var(--bg);color:var(--fg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0;text-wrap:balance}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mut{color:var(--mut);font-size:13px}
.bud{font-size:22px;font-weight:700;text-align:center;letter-spacing:.02em}
.para{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.para{grid-template-columns:1fr}}
.karta{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.karta:hover{border-color:var(--acc)}
.obraz{width:100%;aspect-ratio:1;max-width:100%;background-color:var(--tile);background-repeat:no-repeat;background-size:1000% 100%;border-radius:8px}
.kto{min-height:2.6em;font-size:13px;text-align:center}
.kto b{display:block;font-size:14px}
.akcje{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.akcje .btn{min-width:120px}
.btn.g{border-color:var(--acc);color:var(--acc);font-weight:600}
.btn.r{border-color:var(--acc2);color:var(--acc2)}
.ost{background:var(--hi);border-radius:8px;padding:8px 12px;font-size:13px;min-height:1.4em}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.mini{width:56px;height:56px;border-radius:4px;background-size:1000% 100%;background-color:var(--tile);display:inline-block;vertical-align:middle}
.pasek{height:8px;background:var(--acc);border-radius:4px}
.sekcja{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bud-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bud-grid figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
.bud-grid .obraz{border-radius:6px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
</style>
<div class="wrap">
  <div class="top">
    <h1>Pojedynki dobrych obrazów: LoRA v1 (prompty v1) i LoRA v2 (prompty v2)</h1>
    <div class="tabs"><button data-t="gra" class="on">Porównuj</button><button data-t="mod">Ranking modeli</button><button data-t="bud">Najlepsze per budynek</button></div>
  </div>
  <div class="mut" id="status">Ładowanie…</div>

  <section id="gra" style="display:flex;flex-direction:column;gap:12px">
    <div class="bud" id="budynek"></div>
    <div class="para">
      <div class="karta" id="L"><div class="obraz"></div><div class="kto mut">?</div></div>
      <div class="karta" id="P"><div class="obraz"></div><div class="kto mut">?</div></div>
    </div>
    <div class="akcje">
      <button class="btn g" data-w="1">◀ lewy lepszy</button>
      <button class="btn" data-w="0">remis (oba dobre)</button>
      <button class="btn r" data-w="3">oba słabe</button>
      <button class="btn g" data-w="2">prawy lepszy ▶</button>
    </div>
    <div class="akcje"><button class="btn" id="pomin">pomiń</button><button class="btn" id="cofnij">cofnij ostatni</button></div>
    <div class="ost" id="ost">Nazwy modeli są ukryte do momentu oceny. Klawisze: <kbd>←</kbd> lewy, <kbd>→</kbd> prawy, <kbd>↓</kbd> remis, <kbd>X</kbd> oba słabe, <kbd>S</kbd> pomiń, <kbd>Backspace</kbd> cofnij.</div>
    <div class="mut" id="licznik"></div>
  </section>

  <section id="mod" hidden class="sekcja"></section>
  <section id="bud" hidden class="sekcja"></section>
</div>
<script>
const DANE = /*DANE*/null;
const $ = s => document.querySelector(s);
const W = {}; DANE.wiersze.forEach(w => W[w.id] = w);
const OBRAZY = []; DANE.wiersze.forEach(w => w.j.forEach(j => OBRAZY.push(w.id + "|" + j)));
const nazwa = id => { const w = W[id]; return `${w.model}${w.px ? " " + w.px : ""} · ${w.zestaw}`; };
function styl(el, key) { const [id, j] = key.split("|"); el.style.backgroundImage = `url("elo_arkusze/${id}.jpg")`; el.style.backgroundPosition = `${j / 9 * 100}% 0`; }

let db = null, wszystkie = {}, moje = [], sesja = Date.now().toString(36) + Math.random().toString(36).slice(2, 6), para = null, ostPara = "";
const KAWAL = 200;   // glosow w jednym dokumencie
function glosy() { const v = []; for (const k in wszystkie) if (!k.startsWith(sesja + "_")) v.push(...wszystkie[k]); v.push(...moje); return v.sort((a, b) => a[3] - b[3]); }

// Bradley-Terry: kazdy ma "sile" p; szansa ze A wygra z B = pA/(pA+pB). Liczone ze WSZYSTKICH glosow naraz (kolejnosc bez znaczenia).
// Remis = pol wygranej dla kazdego. "Oba slabe" nie wchodzi do sily (liczone osobno). Lagodny priorytet: 1 wirtualny remis z przecietnym.
// Wynik w skali jak Elo: 1500 + 400*log10(p); +/- = 90% niepewnosci.
function bt(klucze, gry) {
  const p = {}, W = {}, gr = {}; klucze.forEach(k => { p[k] = 1; W[k] = .5; gr[k] = []; });
  for (const [a, b, s] of gry) { if (!(a in p) || !(b in p) || a === b) continue; W[a] += s; W[b] += 1 - s; gr[a].push(b); gr[b].push(a); }
  for (let it = 0; it < 300; it++) {
    for (const k of klucze) { let m = 1 / (p[k] + 1); for (const o of gr[k]) m += 1 / (p[k] + p[o]); p[k] = W[k] / m; }
    const g = Math.exp(klucze.reduce((x, k) => x + Math.log(p[k]), 0) / klucze.length); klucze.forEach(k => p[k] /= g);
  }
  const C = 400 / Math.LN10, out = {};
  for (const k of klucze) { let inf = p[k] / (p[k] + 1) ** 2; for (const o of gr[k]) inf += p[k] * p[o] / (p[k] + p[o]) ** 2;
    out[k] = { s: 1500 + C * Math.log(p[k]), pm: 1.645 * C / Math.sqrt(inf), n: gr[k].length }; }
  return out;
}
function policz() {
  const n = {}, st = {}, gry = []; OBRAZY.forEach(k => { n[k] = 0; st[k] = [0, 0, 0, 0]; });
  for (const [a, b, w] of glosy()) {
    if (!(a in n) || !(b in n)) continue; n[a]++; n[b]++;
    if (w == 1) { st[a][0]++; st[b][1]++; } else if (w == 2) { st[b][0]++; st[a][1]++; } else if (w == 0) { st[a][2]++; st[b][2]++; } else { st[a][3]++; st[b][3]++; }
    if (w != 3) gry.push([a, b, w == 1 ? 1 : w == 2 ? 0 : .5]);
  }
  const ob = bt(OBRAZY, gry), elo = {}; OBRAZY.forEach(k => elo[k] = ob[k].s);
  const wr = bt(DANE.wiersze.map(w => w.id), gry.map(([a, b, s]) => [a.split("|")[0], b.split("|")[0], s]));
  return { elo, n, st, ob, wr };
}

function losuj() {
  const { elo, n } = policz(), los = a => a[Math.floor(Math.random() * a.length)];
  // budynek z najmniejsza liczba porownan (z losowoscia)
  const bud = DANE.budynki.map((_, b) => b).filter(b => OBRAZY.filter(k => k.endsWith("|" + b)).length >= 2).map(b => ({ b, s: OBRAZY.filter(k => k.endsWith("|" + b)).reduce((x, k) => x + n[k], 0) + Math.random() * 6 }));
  const b = bud.sort((x, y) => x.s - y.s)[Math.random() < .7 ? 0 : Math.floor(Math.random() * bud.length)].b;
  const pula = OBRAZY.filter(k => k.endsWith("|" + b));
  const minN = Math.min(...pula.map(k => n[k])); const a = los(pula.filter(k => n[k] <= minN + 1));
  const reszta = pula.filter(k => k !== a);
  let c;
  if (Math.random() < .5) { const m2 = Math.min(...reszta.map(k => n[k])); c = los(reszta.filter(k => n[k] <= m2 + 1)); }
  else c = los(reszta.sort((x, y) => Math.abs(elo[x] - elo[a]) - Math.abs(elo[y] - elo[a])).slice(0, 6));
  if ([a, c].sort().join() === ostPara && pula.length > 2) return losuj();
  ostPara = [a, c].sort().join();
  return Math.random() < .5 ? [a, c] : [c, a];
}

function pokaz() {
  para = losuj();
  $("#budynek").textContent = DANE.budynki[+para[0].split("|")[1]];
  styl($("#L .obraz"), para[0]); styl($("#P .obraz"), para[1]);
  $("#L .kto").textContent = "?"; $("#P .kto").textContent = "?";
  const nast = losuj(); ostPara = para.slice().sort().join();   // podgrzej arkusze nastepnej pary
  nast.forEach(k => { const i = new Image(); i.src = `elo_arkusze/${k.split("|")[0]}.jpg`; });
  const g = glosy().length; $("#licznik").textContent = `Oddane głosy: ${g} (w tej sesji ${moje.length}). Obrazów w puli: ${OBRAZY.length}, wierszy: ${DANE.wiersze.length}.`;
}

let zapisTimer = null, zapisTrwa = false;
async function zapisz() {
  if (!db) return; if (zapisTrwa) { clearTimeout(zapisTimer); zapisTimer = setTimeout(zapisz, 400); return; }
  zapisTrwa = true;
  try {
    for (let c = 0; c * KAWAL < Math.max(moje.length, 1); c++)
      await db.doc(`glosy/${sesja}_${c}`).set({ v: moje.slice(c * KAWAL, (c + 1) * KAWAL), sesja });
    const pusty = Math.ceil(moje.length / KAWAL); if (moje.length % KAWAL === 0 && pusty > 0) await db.doc(`glosy/${sesja}_${pusty}`).delete().catch(() => {});
    $("#status").textContent = "Zapisano (" + moje.length + " w tej sesji).";
  } catch (e) { $("#status").textContent = "Błąd zapisu: " + (e.code || e.message) + " – głosy są w tej karcie, nie zamykaj jej."; }
  zapisTrwa = false;
}

function glos(w) {
  if (!para) return;
  const [a, b] = para; moje.push([a, b, w, Date.now()]);
  const opis = { 1: "lewy lepszy", 2: "prawy lepszy", 0: "remis", 3: "oba słabe" }[w];
  $("#ost").innerHTML = `<b>${opis}</b> — lewy: ${nazwa(a.split("|")[0])} · prawy: ${nazwa(b.split("|")[0])}`;
  clearTimeout(zapisTimer); zapisTimer = setTimeout(zapisz, 300); pokaz();
}
function cofnij() { if (!moje.length) return; const g = moje.pop(); $("#ost").textContent = "Cofnięto ostatni głos."; zapisTimer = setTimeout(zapisz, 300); para = [g[0], g[1]];
  $("#budynek").textContent = DANE.budynki[+g[0].split("|")[1]]; styl($("#L .obraz"), g[0]); styl($("#P .obraz"), g[1]); }

document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => glos(+b.dataset.w));
$("#L").onclick = () => glos(1); $("#P").onclick = () => glos(2);
$("#pomin").onclick = pokaz; $("#cofnij").onclick = cofnij;
document.addEventListener("keydown", e => {
  if ($("#gra").hidden) return;
  const m = { ArrowLeft: 1, ArrowRight: 2, ArrowDown: 0, x: 3, X: 3 }[e.key];
  if (m !== undefined) { e.preventDefault(); glos(m); } else if (e.key === "s" || e.key === "S") pokaz(); else if (e.key === "Backspace") { e.preventDefault(); cofnij(); }
});

function rankingi() {
  const { elo, n, st, ob, wr } = policz();
  const r = DANE.wiersze.map(w => { const ks = w.j.map(j => w.id + "|" + j); const t = [0, 0, 0, 0]; ks.forEach(k => st[k].forEach((v, i) => t[i] += v));
    return { w, ...wr[w.id], t }; }).sort((a, b) => b.s - a.s);
  const lo = Math.min(...r.map(x => x.s - x.pm)), hi = Math.max(...r.map(x => x.s + x.pm)), X = v => ((v - lo) / ((hi - lo) || 1) * 100).toFixed(1);
  const grupy = {}; r.forEach(x => { if (!x.n) return; (grupy[x.w.zestaw] ||= []).push(x.s); });
  $("#mod").innerHTML = `<div class="mut">Wynik Bradley-Terry w skali jak Elo (1500 = przeciętny). Liczony ze wszystkich pojedynków wiersza naraz; pasek = 90% niepewności. Gdy paski dwóch modeli się nakładają, jeszcze nie wiadomo, który lepszy. „Oba słabe” nie wpływa na wynik, jest w osobnej kolumnie.</div>
   <div class="mut">Średnio wg zestawu: ${Object.entries(grupy).map(([k, v]) => `<b>${k}</b> ${Math.round(v.reduce((a, b) => a + b) / v.length)}`).join(" · ")}</div>
   <div class="tw"><table><tr><th>#</th><th>model</th><th>zestaw</th><th>wynik</th><th style="min-width:160px">niepewność</th><th>wygr./przegr./remis</th><th>oba słabe</th><th>dobrych obr.</th></tr>
   ${r.map((x, i) => `<tr><td class="n">${i + 1}</td><td>${x.w.model}${x.w.px ? " · " + x.w.px : ""}<div class="mut">${x.w.opis}</div></td><td>${x.w.zestaw}</td>
     <td class="n"><b>${x.n ? Math.round(x.s) : "–"}</b>${x.n ? `<div class="mut">±${Math.round(x.pm)}</div>` : ""}</td>
     <td>${x.n ? `<div style="position:relative;height:10px;background:var(--tile);border-radius:5px"><div class="pasek" style="position:absolute;left:${X(x.s - x.pm)}%;width:${(X(x.s + x.pm) - X(x.s - x.pm)).toFixed(1)}%;opacity:.45"></div><div style="position:absolute;left:${X(x.s)}%;top:-3px;width:3px;height:16px;background:var(--fg)"></div></div>` : `<span class="mut">brak pojedynków</span>`}</td>
     <td class="n">${x.t.slice(0, 3).join(" / ")}</td><td class="n">${x.t[3]}</td><td class="n">${x.w.j.length}</td></tr>`).join("")}</table></div>`;
  $("#bud").innerHTML = DANE.budynki.map((t, b) => { const ks = OBRAZY.filter(k => k.endsWith("|" + b) && n[k] > 0).sort((x, y) => elo[y] - elo[x]);
    return `<div><h3 style="margin:4px 0">${t}</h3>${ks.length ? `<div class="bud-grid">${ks.map(k => `<figure><div class="obraz" data-k="${k}"></div><figcaption><b>${Math.round(elo[k])}</b> ±${Math.round(ob[k].pm)} (${n[k]} por.) · ${nazwa(k.split("|")[0])}</figcaption></figure>`).join("")}</div>` : `<div class="mut">jeszcze bez porównań</div>`}</div>`; }).join("");
  document.querySelectorAll("#bud .obraz[data-k]").forEach(el => styl(el, el.dataset.k));
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["gra", "mod", "bud"].forEach(id => $("#" + id).hidden = id !== b.dataset.t);
  $("#gra").style.display = b.dataset.t === "gra" ? "flex" : "none";
  if (b.dataset.t !== "gra") rankingi();
});

pokaz();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { $("#status").textContent = "Baza niedostępna – głosy nie zostaną zapisane."; return; }
  $("#status").textContent = "Połączono z bazą.";
  db.collection("glosy").onSnapshot(snap => { wszystkie = {}; for (const d of snap.docs) wszystkie[d.id] = (d.data() || {}).v || [];
    const g = glosy().length; $("#licznik").textContent = `Oddane głosy: ${g} (w tej sesji ${moje.length}). Obrazów w puli: ${OBRAZY.length}, wierszy: ${DANE.wiersze.length}.`;
    if (!$("#mod").hidden || !$("#bud").hidden) rankingi(); }, e => { $("#status").textContent = "Błąd bazy: " + e.code; });
})();
</script>
